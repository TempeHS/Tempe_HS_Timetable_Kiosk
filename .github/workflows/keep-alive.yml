name: Keep Alive

# Runs weekly to prevent GitHub from disabling scheduled workflows
# GitHub disables scheduled workflows after 60 days of repository inactivity

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keep-alive timestamp
        run: |
          echo "Last keep-alive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keep-alive
          echo "This file is automatically updated weekly to prevent GitHub from disabling scheduled workflows."

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .github/keep-alive
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Keep-alive: prevent workflow disable"
            git push
          fi

      - name: Re-enable workflows if disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking workflow states..."
          
          # List all workflows and re-enable any that are disabled
          gh workflow list --all --json name,state | jq -r '.[] | select(.state == "disabled_inactivity") | .name' | while read workflow; do
            if [ -n "$workflow" ]; then
              echo "Re-enabling disabled workflow: $workflow"
              gh workflow enable "$workflow"
            fi
          done
          
          echo "✅ Keep-alive complete"
