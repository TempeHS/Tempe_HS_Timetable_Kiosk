<html>
<head>
    <title id="page-title">Loading...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src 'self' file:; img-src 'self' https://tempe-h.schools.nsw.gov.au data:;">
    <style id="dynamic-styles">
        /* Styles will be loaded dynamically from config */
    </style>
    <style>
        /* Base styles that don't depend on config */
        #data-notices {
            position: fixed;
            right: 12px;
            bottom: 12px;
            max-width: min(60vw, 720px);
            text-align: right;
            z-index: 1000;
        }
        #data-notices:empty {
            display: none;
        }
        .data-notice {
            color: #c00000;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 0.95em;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #c00000;
            border-radius: 6px;
            padding: 6px 10px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="loading-indicator" id="loading-indicator"></div>
    <div id="header"></div>
    <div id="timetable"></div>
    <div id="current-time"></div>
    <div id="data-notices" role="status" aria-live="polite"></div>
    <script src="timetable-core.js"></script>
    <script>
        const Core = window.TimetableCore;
        let CONFIG = null;
        
        // --- CONFIGURATION LOADING ---
        async function loadConfig() {
            let loaded = null;
            try {
                const response = await fetch('config.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                loaded = await response.json();
            } catch (error) {
                console.error('Error loading configuration, using defaults:', error);
            }
            // Missing keys fall back to defaults so the renderer never reads undefined.
            CONFIG = Core.mergeConfig(Core.DEFAULT_CONFIG, loaded);
            applyConfiguration();
            return CONFIG;
        }
        
        function applyConfiguration() {
            if (!CONFIG) return;
            try {
                document.getElementById('page-title').textContent = CONFIG.school.name;
                document.getElementById('dynamic-styles').innerHTML = generateDynamicCSS();
            } catch (error) {
                console.error('Error applying configuration:', error);
            }
        }
        
        function generateDynamicCSS() {
            const c = CONFIG.colors;
            const logo = CONFIG.school.logo;
            
            return `
                body { 
                    font-family: Arial, sans-serif; 
                    background: ${c.background};
                    margin: 0;
                    position: relative;
                }
                body::before {
                    content: '';
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-image: url('${logo.url}');
                    background-repeat: no-repeat;
                    background-position: center center;
                    background-size: ${logo.size};
                    opacity: ${logo.opacity};
                    z-index: -1;
                    pointer-events: none;
                }
                body::after {
                    content: '';
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: ${c.overlay};
                    z-index: -1;
                    pointer-events: none;
                }
                h2 { text-align: center; font-size: 1.5rem }
                .year-section { margin: 20px 20px 20px 32px; }
                .year-label {
                    display: block;
                    font-weight: bold;
                    font-size: 1.25em;
                    margin-bottom: 10px;
                    text-align: left;
                    color: ${c.primary};
                    padding-left: 12px;
                }
                .tiles {
                    display: flex;
                    flex-direction: row;
                    flex-wrap: nowrap;
                    gap: 10px;
                    margin-bottom: 18px;
                    overflow-x: auto;
                }
                .tiles.multi-row {
                    flex-wrap: wrap;
                    overflow-x: visible;
                    max-height: none;
                }
                .tile {
                    background: ${c.tile.background};
                    border: 1px solid ${c.tile.border};
                    border-radius: 11px;
                    min-width: 100px;
                    max-width: 120px;
                    min-height: 56px;
                    padding: 7px 5px;
                    box-shadow: 2px 2px 6px ${c.tile.shadow};
                    display: flex;
                    flex-direction: column;
                    align-items: flex-start;
                    justify-content: center;
                    transition: box-shadow 0.2s;
                }
                .tile:hover {
                    box-shadow: 2px 6px 16px ${c.tile.hover};
                }
                .classcode { font-weight: bold; font-size: 1em; color: ${c.text.classCode}; margin-bottom: 2px; }
                .room { font-size: 0.95em; color: ${c.text.primary}; margin-bottom: 2px; }
                .teacher { font-size: 0.95em; color: ${c.text.primary}; }
                .empty-row {
                    color: ${c.text.secondary};
                    font-style: italic;
                    text-align: center;
                    padding: 14px 0;
                }
                #current-time {
                    text-align: right;
                    font-size: 0.9em;
                    color: ${c.text.primary};
                    margin: 20px 12px 10px 0;
                    transition: opacity 0.3s ease;
                }
                #current-time.manual-override {
                    color: #d73502;
                    font-weight: bold;
                    background: #fff3cd;
                    padding: 5px 10px;
                    border-radius: 4px;
                    border: 1px solid #ffeaa7;
                }
                #current-time.updating {
                    opacity: 0.5;
                }
                
                /* Smooth transition for content updates */
                #header, #timetable {
                    transition: opacity 0.2s ease-in-out;
                }
                
                /* Subtle loading indicator */
                .loading-indicator {
                    position: fixed;
                    top: 10px;
                    right: 10px;
                    width: 12px;
                    height: 12px;
                    border-radius: 50%;
                    background: ${c.primary};
                    opacity: 0;
                    z-index: 1000;
                    transition: opacity 0.3s ease-in-out;
                }
                
                /* Only animate when visible */
                .loading-indicator.visible {
                    animation: pulse 1s infinite;
                }
                
                @keyframes pulse {
                    0%, 100% { opacity: 0.3; transform: scale(1); }
                    50% { opacity: 0.8; transform: scale(1.2); }
                }
                
                /* Responsive breakpoints - will be overridden by config if specified */
                @media (max-width: 1700px) {
                    .tiles { gap: 8px;}
                }
                @media (max-width: 1280px) {
                    .tiles { gap: 6px;}
                }
                @media (max-width: 700px) {
                    .year-section { max-width: 99vw; }
                    .tiles { gap: 4px;}
                    .tile { min-width: 90px; max-width: 100px;}
                }
                
                /* Responsive height breakpoint - compact layout for short screens */
                @media (max-height: ${CONFIG.ui.responsive.breakpoints.compactHeight}px) {
                    .year-section {
                        display: flex;
                        flex-direction: row;
                        align-items: flex-start;
                        gap: 10px;
                        margin: 20px 15px 20px 15px;
                    }
                    
                    .year-label {
                        flex-shrink: 0;
                        min-width: 80px;
                        max-width: 120px;
                        margin-bottom: 0;
                        margin-top: 8px;
                        writing-mode: horizontal-tb;
                        text-align: right;
                        padding-left: 0;
                        padding-right: 12px;
                    }
                    
                    .tiles {
                        flex: 1;
                        margin-bottom: 0;
                    }
                    
                    .tiles.multi-row {
                        max-height: 200px;
                        overflow-y: auto;
                        overflow-x: visible;
                    }
                }
                
                /* Original layout for tall screens */
                @media (min-height: ${CONFIG.ui.responsive.breakpoints.compactHeight + 1}px) {
                    .year-section {
                        display: block;
                        margin: 20px 20px 20px 32px;
                    }
                    
                    .year-label {
                        display: block;
                        margin-bottom: 10px;
                        writing-mode: horizontal-tb;
                        text-align: left;
                        padding-left: 12px;
                        padding-right: 0;
                    }
                    
                    .tiles {
                        margin-bottom: 18px;
                    }
                }
            `;
        }

        // --- MANUAL OVERRIDE FOR TESTING ---
        // 
        // INSTRUCTIONS FOR TESTING:
        // 1. Set USE_MANUAL_OVERRIDE to true
        // 2. Set MANUAL_DATE to the desired date (month is 0-indexed: 0=Jan, 1=Feb, etc.)
        // 3. Set MANUAL_TIME_HOURS (24-hour format: 0-23)
        // 4. Set MANUAL_TIME_MINUTES (0-59)
        // 5. Refresh the page to see the timetable for that date/time
        // 
        // EXAMPLES:
        // - Tuesday P5: new Date(2025, 7, 12), HOURS=13, MINUTES=25 (1:25 PM)
        // - Friday 3:05 PM: new Date(2025, 7, 15), HOURS=15, MINUTES=5
        // - Monday P0: new Date(2025, 7, 11), HOURS=7, MINUTES=45
        //
        const USE_MANUAL_OVERRIDE = false;
        
        // Manual date/time settings (only used when USE_MANUAL_OVERRIDE is true)
        const MANUAL_DATE = new Date(2025, 8, 25); // 25 September 2025 (month is 0-indexed)
        const MANUAL_TIME_HOURS = 8; // 8 AM
        const MANUAL_TIME_MINUTES = 20; // 20 minutes
        
        // Function to get current time (real or overridden)
        function getCurrentTime() {
            if (USE_MANUAL_OVERRIDE) {
                const manualDateTime = new Date(MANUAL_DATE);
                manualDateTime.setHours(MANUAL_TIME_HOURS, MANUAL_TIME_MINUTES, 0, 0);
                return manualDateTime;
            }
            return new Date();
        }
        
        // --- UTILS ---
        const pad2 = n => n < 10 ? '0' + n : n;

        function debugLog(message, ...args) {
            if (CONFIG && CONFIG.ui && CONFIG.ui.debug) {
                console.log(message, ...args);
            }
        }
        
        function debugWarn(message, ...args) {
            if (CONFIG && CONFIG.ui && CONFIG.ui.debug) {
                console.warn(message, ...args);
            }
        }

        function withCacheBuster(path) {
            return CONFIG && CONFIG.ui.cacheBusting ? `${path}?t=${Date.now()}` : path;
        }

        // --- XML LOADING ---
        function loadXML(path) {
            return fetch(withCacheBuster(path))
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(str => {
                    const parser = new window.DOMParser();
                    const xml = parser.parseFromString(str, "text/xml");
                    
                    // Check for XML parsing errors
                    const parseError = xml.getElementsByTagName("parsererror")[0];
                    if (parseError) {
                        throw new Error(`XML Parse Error: ${parseError.textContent}`);
                    }
                    
                    return xml;
                })
                .catch(error => {
                    console.error("Error loading XML:", error);
                    
                    // Provide helpful error message for CORS issues
                    if (error.message.includes('CORS') || error.message.includes('fetch')) {
                        throw new Error(`CORS Error: Cannot load local files. Please run this application using a local web server. See instructions below.`);
                    }
                    
                    throw error;
                });
        }

        // --- DATA PARSING ---
        // Helper function to extract member values from XML
        function extractMemberValue(members, memberName) {
            for(let j = 0; j < members.length; j++) {
                const member = members[j];
                const nameEl = member.getElementsByTagName("name")[0];
                const valueEl = member.getElementsByTagName("value")[0];
                
                if(nameEl && valueEl && nameEl.textContent === memberName) {
                    return valueEl.textContent;
                }
            }
            return null;
        }

        async function fetchJson(path) {
            const response = await fetch(withCacheBuster(path));
            if (!response.ok) {
                throw new Error(`${path}: HTTP ${response.status}`);
            }
            return response.json();
        }

        // Loads one data source: fresh JSON -> XML -> stale JSON (see Core.loadWithFallback).
        async function loadSource(source, defaults, parseJson, parseXml) {
            const api = CONFIG.api || {};
            const files = (CONFIG.dataSources && CONFIG.dataSources[source]) || {};
            const jsonFile = files.json_file || defaults.json;
            const xmlFile = files.xml_file || defaults.xml;
            const maxAgeDays = Core.getStaleDays(CONFIG, source);

            const result = await Core.loadWithFallback({
                useJson: api.use_json !== false,
                fallbackToXml: api.fallback_to_xml !== false,
                maxAgeDays,
                loadJson: async () => {
                    const json = await fetchJson(jsonFile);
                    return { metadata: json.metadata, data: parseJson(json) };
                },
                loadXml: async () => parseXml(await loadXML(xmlFile))
            });

            debugLog(`🎯 ${source}: using ${result.source} (stale after ${maxAgeDays} days), ${result.data.length} entries`);
            if (result.source === 'json-stale') {
                console.warn(`${source}: JSON is older than ${maxAgeDays} days and XML failed to load; using stale JSON`);
            }
            return result;
        }

        function loadBellTimesData() {
            return loadSource('bell_times', { json: 'bell_times.json', xml: 'bell_times.xml' }, parseBellTimesJSON, parseBellTimesXML);
        }
        
        // Parse JSON bell times format (from Sentral API)
        function parseBellTimesJSON(jsonData) {
            if (!jsonData || !Array.isArray(jsonData.bell_times)) {
                throw new Error('Invalid bell times JSON - missing bell_times array');
            }
            
            const periods = [];
            for (const entry of jsonData.bell_times) {
                if (entry && entry.Period && entry.StartTime && entry.EndTime) {
                    periods.push({
                        period: entry.Period,
                        start: Core.parseTime(entry.StartTime),
                        end: Core.parseTime(entry.EndTime),
                        dayName: entry.DayName,
                        dayNumber: entry.DayNumber,
                        type: entry.Type,
                        source: 'api'
                    });
                } else {
                    debugWarn('⚠️  BELL TIMES: Skipping invalid JSON entry:', entry);
                }
            }
            return periods;
        }
        
        // Parse XML bell times format (existing format)
        function parseBellTimesXML(xml) {
            const periods = [];
            const nodes = xml.getElementsByTagName("struct");
            
            for(let i = 0; i < nodes.length; i++) {
                const members = nodes[i].getElementsByTagName("member");
                
                const periodName = extractMemberValue(members, "Period");
                const startTime = extractMemberValue(members, "StartTime");
                const endTime = extractMemberValue(members, "EndTime");
                const dayName = extractMemberValue(members, "DayName");
                const dayNumber = extractMemberValue(members, "DayNumber");
                const type = extractMemberValue(members, "Type");
                
                if(periodName && startTime && endTime) {
                    periods.push({
                        period: periodName,
                        start: Core.parseTime(startTime),
                        end: Core.parseTime(endTime),
                        dayName: dayName,
                        dayNumber: dayNumber ? parseInt(dayNumber) : null,
                        type: type,
                        source: 'xml'
                    });
                }
            }
            return periods;
        }
        
        // --- CALENDAR DATA LOADING ---
        async function loadCalendarData() {
            const result = await loadSource('calendar', { json: 'calendar.json', xml: 'calendar.xml' }, parseCalendarJSON, parseCalendarXML);
            if (result.source === 'xml' || CONFIG.api.fallback_to_xml === false) {
                return result;
            }
            // The JSON calendar only covers a few weeks; fill later dates from the full-year XML.
            try {
                const xmlFile = (CONFIG.dataSources.calendar && CONFIG.dataSources.calendar.xml_file) || 'calendar.xml';
                const xmlCalendar = parseCalendarXML(await loadXML(xmlFile));
                return { ...result, data: Core.mergeCalendars(result.data, xmlCalendar) };
            } catch (error) {
                debugWarn('⚠️  CALENDAR: Could not merge XML calendar:', error.message);
                return result;
            }
        }
        
        // Parse JSON calendar format (from Sentral API)
        function parseCalendarJSON(jsonData) {
            if (!jsonData || !Array.isArray(jsonData.calendar)) {
                throw new Error('Invalid calendar JSON - missing calendar array');
            }
            
            const calendar = [];
            for (const entry of jsonData.calendar) {
                if (entry && entry.date && entry.day_name && entry.day_number !== undefined) {
                    calendar.push({
                        date: new Date(entry.date + 'T00:00:00'), // Ensure proper date parsing
                        dayName: entry.day_name,
                        dayNumber: entry.day_number,
                        isSchoolDay: entry.is_school_day,
                        dayType: entry.day_type,
                        cycle: entry.cycle,
                        source: 'api'
                    });
                } else {
                    debugWarn('⚠️  CALENDAR: Skipping invalid JSON entry:', entry);
                }
            }
            return calendar;
        }
        
        // Parse XML calendar format (existing format)
        function parseCalendarXML(xml) {
            const calendar = [];
            const nodes = xml.getElementsByTagName("struct");
            
            for(let i = 0; i < nodes.length; i++) {
                const members = nodes[i].getElementsByTagName("member");
                
                const dateStr = extractMemberValue(members, "Date");
                const dayName = extractMemberValue(members, "DayName");
                const dayNumber = extractMemberValue(members, "DayNumber");
                
                if(dateStr && dayName && dayNumber) {
                    // Parse ISO date format: 20250811T00:00:00
                    const dateMatch = dateStr.match(/(\d{4})(\d{2})(\d{2})T/);
                    if(dateMatch) {
                        calendar.push({
                            date: new Date(dateMatch[1], dateMatch[2] - 1, dateMatch[3]),
                            dayName: dayName,
                            dayNumber: parseInt(dayNumber),
                            isSchoolDay: dayName !== 'weekend' && dayName !== 'holiday',
                            dayType: dayName,
                            source: 'xml'
                        });
                    }
                }
            }
            return calendar;
        }
        
        // --- LISS DATA LOADING (JSON/XML DUAL SOURCE) ---
        function loadLissData() {
            return loadSource('liss_info', { json: 'liss_info.json', xml: 'liss_info.xml' }, parseLissJSON, parseLissXML);
        }
        
        // Lessons from both sources are normalised to {DayNumber, Period, ClassCode, TeacherCode, RoomCode}.
        function parseLissJSON(jsonData) {
            if (!jsonData || !Array.isArray(jsonData.timetable_data)) {
                throw new Error('Invalid LISS JSON - missing timetable_data array');
            }
            return jsonData.timetable_data
                .filter(entry => entry && entry.Period && entry.ClassCode)
                .map(entry => ({
                    DayNumber: entry.DayNumber,
                    Period: entry.Period,
                    ClassCode: entry.ClassCode,
                    TeacherCode: entry.TeacherCode,
                    RoomCode: entry.RoomCode
                }));
        }

        function parseLissXML(xml) {
            const lessons = [];
            const nodes = xml.getElementsByTagName("struct");
            for (let i = 0; i < nodes.length; i++) {
                const members = nodes[i].getElementsByTagName("member");
                const period = extractMemberValue(members, "Period");
                const classCode = extractMemberValue(members, "ClassCode");
                if (period && classCode) {
                    lessons.push({
                        DayNumber: extractMemberValue(members, "DayNumber"),
                        Period: period,
                        ClassCode: classCode,
                        TeacherCode: extractMemberValue(members, "TeacherCode"),
                        RoomCode: extractMemberValue(members, "RoomCode")
                    });
                }
            }
            return lessons;
        }

        // --- RENDER ---
        const esc = value => Core.escapeHtml(value);

        function updateClock() {
            const now = getCurrentTime();
            const currentTime = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
            const timeElement = document.getElementById('current-time');
            timeElement.textContent = USE_MANUAL_OVERRIDE ? `⚠️ MANUAL OVERRIDE: ${currentTime}` : `Current time: ${currentTime}`;
            timeElement.className = USE_MANUAL_OVERRIDE ? 'manual-override' : '';
        }

        function renderHeader(period, dateObj, forceNextDay) {
            let periodLabel = period || "No Period";
            if (CONFIG.schedule.periods[period] && CONFIG.schedule.periods[period].description) {
                periodLabel = CONFIG.schedule.periods[period].description;
            } else if (period && period.match(/^P\d+$/)) {
                periodLabel = `Period ${period.substring(1)}`;
            }
            
            const datePrefix = forceNextDay ? "Next: " : "";
            const dateLabel = datePrefix + Core.formatLongDay(dateObj) + " " + Core.formatAuDate(dateObj);
            
            document.getElementById('header').innerHTML = `<h2>${esc(periodLabel)} - ${esc(dateLabel)}</h2>`;
            updateClock();
        }

        function renderMessage(message) {
            document.getElementById('header').innerHTML = `<h2>${esc(message)}</h2>`;
            document.getElementById('timetable').innerHTML = '';
            updateClock();
        }
        
        function renderTimetable(lessonsByYear, currentPeriod, targetDate) {
            let html = "";
            
            for (const yearNum of CONFIG.yearGroups.displayYears) {
                const year = yearNum.toString();
                const lessons = lessonsByYear[year];
                if (!lessons) continue;
                
                const isMultiRowYear = CONFIG.yearGroups.multiRowYears.includes(yearNum);
                const tilesClass = isMultiRowYear ? 'tiles multi-row' : 'tiles';
                const yearLabel = Core.getYearLabel(year, calendarData, targetDate, currentPeriod, CONFIG);
                
                html += `<div class="year-section">
                    <span class="year-label">${esc(yearLabel)}</span>
                    <div class="${tilesClass}">`;
                    
                if (lessons.length > 0) {
                    for (const lesson of lessons) {
                        html += `<div class="tile">
                            <div class="classcode">${esc(String(lesson.ClassCode || "").substring(0, 7))}</div>
                            <div class="room">${esc(lesson.RoomCode)}</div>
                            <div class="teacher">${esc(lesson.TeacherCode)}</div>
                        </div>`;
                    }
                } else {
                    html += `<span class="empty-row">No classes</span>`;
                }
                html += `</div></div>`;
            }
            document.getElementById('timetable').innerHTML = html;
        }

        // --- MAIN ---
        let bellTimes = [];
        let lessons = [];
        let calendarData = [];
        let hasRendered = false;
        let dataStatus = {};
        
        // Each source loads independently; a source that fails keeps its last good data.
        async function loadAllData() {
            const results = await Promise.allSettled([loadBellTimesData(), loadLissData(), loadCalendarData()]);
            const previous = { bell_times: bellTimes, liss_info: lessons, calendar: calendarData };
            const keys = ['bell_times', 'liss_info', 'calendar'];
            const [bellResult, lissResult, calendarResult] = results;
            if (bellResult.status === 'fulfilled') bellTimes = bellResult.value.data;
            if (lissResult.status === 'fulfilled') lessons = lissResult.value.data;
            if (calendarResult.status === 'fulfilled') calendarData = calendarResult.value.data;

            dataStatus = {};
            results.forEach((r, i) => {
                dataStatus[keys[i]] = r.status === 'fulfilled'
                    ? r.value
                    : { failed: true, hasPreviousData: previous[keys[i]].length > 0, error: (r.reason && r.reason.message) || String(r.reason) };
            });
            
            const failures = results.filter(r => r.status === 'rejected').map(r => r.reason);
            failures.forEach(error => console.error('Error loading data:', error));
            debugLog('📊 Data sources (bell times, lessons, calendar):', results.map(r => r.status === 'fulfilled' ? r.value.source : 'failed'));
            return failures;
        }

        function renderNotices() {
            try {
                const notices = Core.getDataNotices(dataStatus, new Date());
                document.getElementById('data-notices').innerHTML = notices
                    .map(text => `<div class="data-notice">⚠️ ${esc(text)}</div>`)
                    .join('');
            } catch (error) {
                console.error('Error rendering data notices:', error);
            }
        }

        function render(failures = []) {
            renderNotices();
            try {
                if (!bellTimes.length || !lessons.length || !calendarData.length) {
                    renderLoadError(failures);
                    return;
                }
                const view = Core.selectDisplay({ bellTimes, lessons, calendar: calendarData, now: getCurrentTime(), config: CONFIG });
                if (!view.period) {
                    renderMessage(view.message);
                } else {
                    renderHeader(view.period, view.date, view.forceNextDay);
                    renderTimetable(view.lessonsByYear, view.period, view.date);
                }
                hasRendered = true;
            } catch (error) {
                console.error('Error rendering timetable:', error);
                // Keep the last good screen on the kiosk rather than replacing it with an error.
                if (!hasRendered) renderLoadError([error]);
            }
        }
        
        async function main() {
            const failures = await loadAllData();
            render(failures);
        }

        function renderLoadError(failures) {
            const messages = failures.map(e => (e && e.message) || String(e));
            let helpText;
            
            if (messages.some(m => m.includes('CORS'))) {
                helpText = `
                    <div style="text-align: center; padding: 20px; color: #666; max-width: 600px; margin: 0 auto;">
                        <p><strong>CORS Policy Error:</strong> Modern browsers block local file access for security reasons.</p>
                        <p><strong>To run this application locally, you need to use a web server:</strong></p>
                        <div style="text-align: left; background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0;">
                            <p><strong>Option 1 - Python (if installed):</strong></p>
                            <code>python -m http.server 8000</code><br>
                            <small>Then open: http://localhost:8000</small>
                            
                            <p style="margin-top: 15px;"><strong>Option 2 - Node.js (if installed):</strong></p>
                            <code>npx http-server</code><br>
                            <small>Then open the provided URL</small>
                            
                            <p style="margin-top: 15px;"><strong>Option 3 - PHP (if installed):</strong></p>
                            <code>php -S localhost:8000</code><br>
                            <small>Then open: http://localhost:8000</small>
                            
                            <p style="margin-top: 15px;"><strong>Option 4 - VS Code Live Server:</strong></p>
                            <small>Install "Live Server" extension and right-click index.html → "Open with Live Server"</small>
                        </div>
                        <p>Make sure config.json and data files are in the same folder as index.html</p>
                    </div>`;
            } else {
                helpText = `
                    <div style="text-align: center; padding: 20px; color: #666;">
                        <p>Unable to load timetable data.</p>
                        <p>Please ensure config.json and the data files are in the same folder.</p>
                        <p>Error: ${esc(messages.join('; ') || 'No data available')}</p>
                    </div>`;
            }
            
            document.getElementById('header').innerHTML = "<h2>Error loading timetable data</h2>";
            document.getElementById('timetable').innerHTML = helpText;
        }

        // ---- AUTO-RELOAD ----
        // Show/hide loading indicator
        function showLoadingIndicator() {
            const indicator = document.getElementById('loading-indicator');
            if (indicator) {
                indicator.classList.add('visible');
                indicator.style.opacity = '1';
            }
        }
        
        function hideLoadingIndicator() {
            const indicator = document.getElementById('loading-indicator');
            if (indicator) {
                indicator.classList.remove('visible');
                indicator.style.opacity = '0';
            }
        }
        
        // Smooth data refresh without page flash
        function setupAutoReload() {
            // Check if auto-refresh is disabled in config
            if (CONFIG?.ui?.autoRefresh === false) {
                debugLog('🔄 AUTO-RELOAD: Disabled by configuration');
                return;
            }
            
            if (CONFIG && CONFIG.ui.refreshInterval) {
                debugLog(`🔄 AUTO-RELOAD: Setting up ${CONFIG.ui.refreshInterval / 1000}s refresh interval`);
                setInterval(async () => {
                    // Smooth reload: just re-run main() to refresh data
                    await smoothDataRefresh();
                }, CONFIG.ui.refreshInterval);
            } else {
                // Default fallback: refresh every minute
                debugLog('🔄 AUTO-RELOAD: Using default 60s refresh interval');
                setInterval(async () => {
                    await smoothDataRefresh();
                }, 60000);
            }
        }

        // Perform a smooth data refresh with visual feedback
        async function smoothDataRefresh() {
            try {
                showLoadingIndicator();
                
                // Add slight fade effect to indicate update
                const timeElement = document.getElementById('current-time');
                if (timeElement) {
                    timeElement.classList.add('updating');
                }
                
                await main();
                
                // Remove update indicators
                if (timeElement) {
                    timeElement.classList.remove('updating');
                }
                
            } catch (error) {
                console.error('Error during smooth refresh:', error);
            } finally {
                hideLoadingIndicator();
            }
        }

        // A reload while the server is unreachable would leave the kiosk on a browser error page.
        async function safeReload(reason) {
            try {
                const response = await fetch(`config.json?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                debugLog(`🔄 RELOAD: ${reason}`);
                location.replace(location.href);
            } catch (error) {
                console.warn(`Skipping ${reason}: server not reachable (${error.message})`);
            }
        }

        // Optional: Full page reload every hour to prevent memory leaks
        function setupHourlyReload() {
            const hourlyInterval = CONFIG?.ui?.hourlyReload !== false ? 3600000 : null; // 1 hour, can be disabled
            
            if (hourlyInterval) {
                setInterval(() => safeReload('hourly reload'), hourlyInterval);
            }
        }

        // Daily full page reload at 7:30am to start fresh each morning
        function setupDailyReload() {
            const now = new Date();
            const target = new Date();
            target.setHours(7, 30, 0, 0); // 7:30:00 AM
            
            // If 7:30am has already passed today, schedule for tomorrow
            if (now > target) {
                target.setDate(target.getDate() + 1);
            }
            
            const timeUntilReload = target.getTime() - now.getTime();
            
            debugLog(`🔄 DAILY RELOAD: Scheduled for ${target.toLocaleString()}`);
            
            setTimeout(() => safeReload('daily 7:30am reload'), timeUntilReload);
        }

        window.addEventListener('error', event => {
            console.error('Unhandled error:', event.error || event.message);
        });
        window.addEventListener('unhandledrejection', event => {
            console.error('Unhandled promise rejection:', event.reason);
            event.preventDefault();
        });

        // Initialize the application
        async function init() {
            if (!Core) {
                document.getElementById('header').innerHTML = '<h2>Error: timetable-core.js failed to load</h2>';
                return;
            }
            await loadConfig();
            setupAutoReload();
            setupHourlyReload(); // Optional full page reload every hour
            setupDailyReload(); // Daily full page reload at 7:30am
            document.getElementById('header').innerHTML = '<h2>Loading data...</h2>';
            await smoothDataRefresh();
        }

        init().catch(error => console.error('Initialisation failed:', error));
    </script>
</body>
</html>
